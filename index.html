<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFE4">
  <!-- A personal app: keep it out of search results -->
  <meta name="robots" content="noindex, nofollow">
  <title>לוח השנה שלי</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="לוח השנה">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://hhpoypzgnlmkmundyvft.supabase.co" crossorigin>
  <!-- Fonts: our own copies in fonts/ (@font-face at the top of style.css). No preload - measured, it made a cold open no faster -->
  <!-- ?v= is raised on every update (here, in the two imports, and VERSION in sw.js), so a phone never mixes old and new files -->
  <link rel="stylesheet" href="style.css?v=17">
  <link rel="modulepreload" href="data.js?v=17">
  <link rel="modulepreload" href="config.js?v=17">
  <!-- Our own copy of the Supabase library. A classic script, so it runs before app.js -->
  <script src="vendor/supabase.js?v=17"></script>
  <script type="module" src="app.js?v=17"></script>
</head>
<body>
  <main id="app"></main>
  <p id="status" class="sr-only" aria-live="polite"></p>
</body>
</html>
